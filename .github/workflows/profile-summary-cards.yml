name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: '17 16 * * *' # daily, 02:17 Sydney (AEST)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # SUMMARY_GITHUB_TOKEN is a fine-grained PAT with read access to private
          # repos so totals include private activity. Until it is set, the
          # built-in token is used and only public repos are counted.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: 'main'
          UTC_OFFSET: 10
          # Hide languages that only appear via vendored dependencies or old scaffolds.
          EXCLUDE: 'C,C++,Cython,Fortran,Meson,Roff,Smarty,Lua,PowerShell,Batchfile,Hack,PHP,C#,Procfile'
          # We commit the cards ourselves after recolouring (see below).
          AUTO_PUSH: false
          # Transparent theme renders cleanly on both light and dark GitHub.
          THEME: 'transparent'
          NAME: 'Nick Clunes'

      - name: Recolour Python (linguist blue is too close to TypeScript blue)
        run: sed -i 's/3572A5/2ea043/Ig' profile-summary-card-output/transparent/*.svg

      - name: Commit generated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-summary-card-output
          if git diff --staged --quiet; then
            echo 'Cards unchanged; nothing to commit.'
          else
            git commit -m 'Generate profile summary cards'
            git push origin HEAD:main
          fi
